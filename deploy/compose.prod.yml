services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atelier_solidaire
      POSTGRES_USER: atelier_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier_admin -d atelier_solidaire"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ../database/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "root",
          "--password",
          "${MONGO_ADMIN_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://atelier_app:${POSTGRES_APP_PASSWORD}@postgres:5432/atelier_solidaire
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      MONGODB_URL: mongodb://atelier_logs:${MONGO_APP_PASSWORD}@mongo:27017/atelier_solidaire_logs?authSource=admin
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  front:
    build:
      context: ../apps/front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_ORIGIN}
        VITE_WORKSHOP_ID: ${VITE_WORKSHOP_ID}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
