name: Front numeric id verification

on:
  push:
    branches:
      - fix/front-numeric-ids

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify front
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch fix/front-numeric-ids https://github.com/AmineAKIK/atelier-solidaire.git atelier-solidaire
          cd atelier-solidaire
          export NVM_DIR="$HOME/.nvm"
          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          fi
          . "$NVM_DIR/nvm.sh"
          nvm install "$(cat .nvmrc)"
          nvm use "$(cat .nvmrc)"
          cd apps/front
          npm ci
          npm run lint
          git diff --exit-code
          npm run type-check
          npx vitest --run
          npm run build
