name: API corrective verification

on:
  push:
    branches:
      - feat/api-layers-mongodb-tests

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify API, concurrency lock, and Front integration
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch feat/api-layers-mongodb-tests https://github.com/AmineAKIK/atelier-solidaire.git atelier-solidaire
          cd atelier-solidaire

          docker compose -f database/compose.yml up -d

          for attempt in $(seq 1 60); do
            pg_ok=0
            mongo_ok=0
            docker compose -f database/compose.yml exec -T postgres pg_isready -U atelier -d atelier_solidaire >/dev/null 2>&1 && pg_ok=1
            docker compose -f database/compose.yml exec -T mongo mongosh --quiet --username root --password atelier_mongo_root_dev --authenticationDatabase admin --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && mongo_ok=1

            if [[ "$pg_ok" -eq 1 && "$mongo_ok" -eq 1 ]]; then
              break
            fi

            if [[ "$attempt" -eq 60 ]]; then
              docker compose -f database/compose.yml ps
              exit 1
            fi

            sleep 1
          done

          cd apps/api
          npm ci

          export DATABASE_URL=postgresql://atelier:atelier_dev@127.0.0.1:5433/atelier_solidaire_test
          export FRONTEND_ORIGIN=http://localhost:5173
          export MONGODB_URL='mongodb://atelier_logs:atelier_logs_dev@127.0.0.1:27017/atelier_solidaire_logs_test?authSource=admin'
          export ADMIN_API_TOKEN=0123456789abcdef0123456789abcdef
          export PORT=3000

          echo "=== API lint ==="
          npm run lint

          echo "=== API type-check ==="
          npm run type-check

          cd ../..
          echo "=== Recreate PostgreSQL test database immediately before npm test ==="
          ./database/scripts/create-test-db.sh

          cd apps/api
          echo "=== API npm test ==="
          npm test

          echo "=== Concurrency regression without FOR UPDATE OF sc ==="
          cp src/repositories/reservation-repository.ts /tmp/reservation-repository.ts
          sed -i '/FOR UPDATE OF sc/d' src/repositories/reservation-repository.ts

          set +e
          npx vitest --run --reporter=verbose src/__tests__/integration/api.integration.spec.ts -t "allows exactly one of ten concurrent reservations for capacity one"
          no_lock_status=$?
          set -e

          cp /tmp/reservation-repository.ts src/repositories/reservation-repository.ts

          if [[ "$no_lock_status" -eq 0 ]]; then
            echo "Concurrency test unexpectedly passed without FOR UPDATE OF sc." >&2
            exit 1
          fi

          echo "Concurrency test failed without FOR UPDATE OF sc as expected (exit $no_lock_status)."

          cd ../front
          npm ci

          echo "=== Front unit tests ==="
          npm run test:unit -- --run

          echo "=== Front type-check ==="
          npm run type-check

          cd ../..
          echo "=== Prepare production-like local database for end-to-end smoke test ==="
          migrations=(
            database/migrations/001_schema.sql
            database/migrations/002_seed.sql
            database/migrations/003_timezone.sql
            database/migrations/004_backend_demo.sql
            database/migrations/005_test_scenarios.sql
          )
          for migration in "${migrations[@]}"; do
            docker compose -f database/compose.yml exec -T postgres psql               -v ON_ERROR_STOP=1               -U atelier               -d atelier_solidaire < "$migration"
          done

          printf '%s\n'             'PORT=3000'             'DATABASE_URL=postgresql://atelier:atelier_dev@127.0.0.1:5433/atelier_solidaire'             'FRONTEND_ORIGIN=http://localhost:5173'             'MONGODB_URL=mongodb://atelier_logs:atelier_logs_dev@127.0.0.1:27017/atelier_solidaire_logs?authSource=admin'             'ADMIN_API_TOKEN=0123456789abcdef0123456789abcdef'             > apps/api/.env

          printf '%s\n'             'VITE_API_URL=http://localhost:3000'             'VITE_WORKSHOP_ID=2'             > apps/front/.env

          (
            cd apps/api
            npm run dev > /tmp/atelier-api.log 2>&1
          ) &
          api_pid=$!

          (
            cd apps/front
            npm run dev -- --host 127.0.0.1 > /tmp/atelier-front.log 2>&1
          ) &
          front_pid=$!

          cleanup() {
            kill "$api_pid" "$front_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json 2>/dev/null &&
               curl -fsS http://127.0.0.1:5173/ >/tmp/front.html 2>/dev/null; then
              break
            fi

            if [[ "$attempt" -eq 60 ]]; then
              cat /tmp/atelier-api.log
              cat /tmp/atelier-front.log
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/api/workshops/2/availability > /tmp/availability.json
          read -r slot_id category_id < <(
            node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('/tmp/availability.json','utf8')); const row=data.availability.find((item)=>item.remaining>0); if(!row) process.exit(1); console.log(row.slotId, row.categoryId)"
          )

          payload="$(node -e "console.log(JSON.stringify({slotId:Number(process.argv[1]),categoryId:Number(process.argv[2]),firstName:'E2E',lastName:'Smoke',email:'e2e-mongo-up@example.test',itemName:'Laptop',problemDescription:'Smoke test'}))" "$slot_id" "$category_id")"

          status="$(curl -sS -o /tmp/reservation-up.json -w '%{http_code}'             -H 'Content-Type: application/json'             -H 'Origin: http://localhost:5173'             --data "$payload"             http://127.0.0.1:3000/api/reservations)"
          test "$status" = "201"
          echo "End-to-end reservation with MongoDB available: HTTP $status"

          docker compose -f database/compose.yml stop mongo

          curl -fsS http://127.0.0.1:3000/api/workshops/2/availability > /tmp/availability-down.json
          read -r second_slot_id second_category_id < <(
            node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('/tmp/availability-down.json','utf8')); const row=data.availability.find((item)=>item.remaining>0 && String(item.slotId)!==process.argv[1]); if(!row) process.exit(1); console.log(row.slotId, row.categoryId)" "$slot_id"
          )

          payload_down="$(node -e "console.log(JSON.stringify({slotId:Number(process.argv[1]),categoryId:Number(process.argv[2]),firstName:'E2E',lastName:'MongoDown',email:'e2e-mongo-down@example.test',itemName:'Laptop',problemDescription:'Mongo outage smoke test'}))" "$second_slot_id" "$second_category_id")"

          status_down="$(curl -sS -o /tmp/reservation-down.json -w '%{http_code}'             -H 'Content-Type: application/json'             -H 'Origin: http://localhost:5173'             --data "$payload_down"             http://127.0.0.1:3000/api/reservations)"
          test "$status_down" = "201"
          echo "End-to-end reservation with MongoDB unavailable: HTTP $status_down"

          curl -fsS http://127.0.0.1:3000/api/health > /tmp/health-mongo-down.json
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('/tmp/health-mongo-down.json','utf8')); if(data.postgresql.status!=='ok'||data.mongodb.status!=='unavailable') process.exit(1); console.log('Health after MongoDB stop:', JSON.stringify({postgresql:data.postgresql.status,mongodb:data.mongodb.status}))"

          git diff --exit-code
