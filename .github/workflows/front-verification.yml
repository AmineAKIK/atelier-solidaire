name: Front verification

on:
  push:
    branches:
      - dp-at1-exemple3-front-api

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify front
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch dp-at1-exemple3-front-api https://github.com/AmineAKIK/atelier-solidaire.git atelier-solidaire
          cd atelier-solidaire
          export NVM_DIR="$HOME/.nvm"
          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          fi
          . "$NVM_DIR/nvm.sh"
          nvm install "$(cat .nvmrc)"
          nvm use "$(cat .nvmrc)"
          cd apps/front
          npm ci
          npm run lint
          git diff --exit-code
          npm run type-check
          npm run test:unit -- --run
          npm run build
